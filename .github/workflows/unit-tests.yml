name: Isolated unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Run reporting foundation and configuration tests
        run: npm test --prefix server
      - name: Test reviewer evidence presentation
        run: npm test --prefix client

  parser-model-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies including native canvas
        run: npm ci --prefix server --no-audit --no-fund
      - name: Test real parsers and Mongoose validation without a database
        run: npm run test:integration --prefix server

  mongodb-persistence:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server --ignore-scripts --no-audit --no-fund
      - name: Test review writes, assignment races, and permission-scoped queue against temporary MongoDB
        run: npm run test:persistence --prefix server

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix client

  reviewer-browser:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
        working-directory: client
      - name: Test evidence, dashboards, reviewer assignments, and reconciliation queue
        run: npm run test:browser --prefix client
      - name: Retain browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-browser-results
          path: client/test-results/
          retention-days: 7
          if-no-files-found: ignore
